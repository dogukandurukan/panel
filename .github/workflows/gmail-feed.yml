name: gmail-feed
on:
  schedule:
    # Ret mailleri "çok geç geliyor" diye günde 2'den 5'e çıkarıldı.
    - cron: '0 5 * * *'      # 08:00 Türkiye
    - cron: '0 8 * * *'      # 11:00 Türkiye
    - cron: '0 11 * * *'     # 14:00 Türkiye
    - cron: '0 14 * * *'     # 17:00 Türkiye
    - cron: '0 17 * * *'     # 20:00 Türkiye
  workflow_dispatch:          # "Run workflow" ile elle de tetiklenir
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python gmail_feed.py
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # Opsiyonel: yoksa taslak üretilmez, mail listesi normal çalışır.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Gelen kutusu verisi repoya değil gizli gist'e yazılıyor.
          PANEL_GIST_TOKEN: ${{ secrets.PANEL_GIST_TOKEN }}
      - run: python check_rejections.py
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # Sheet'te olmayan retler gizli gist'e yazılıyor (repo herkese açık).
          PANEL_GIST_TOKEN: ${{ secrets.PANEL_GIST_TOKEN }}
