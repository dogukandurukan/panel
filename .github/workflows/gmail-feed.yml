name: gmail-feed
on:
  schedule:
    - cron: '0 6 * * 1-5'    # 09:00 Türkiye (hafta içi)
    - cron: '0 11 * * 1-5'   # 14:00 Türkiye (hafta içi)
  workflow_dispatch:          # "Run workflow" ile elle de tetiklenir
jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python gmail_feed.py
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      - name: gmail.json'u commit et
        run: |
          git config user.name "gmail-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmail.json
          git diff --staged --quiet || git commit -m "gmail.json otomatik güncelleme"
          git push
