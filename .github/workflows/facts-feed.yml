name: facts-feed
on:
  schedule:
    - cron: '0 6 * * 1'     # Pazartesi 09:00 Türkiye (Vikipedi özetleri sık değişmez, haftalık yeter)
  workflow_dispatch:         # "Run workflow" ile elle de tetiklenir
jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python facts_feed.py
      - name: facts.json'u commit et
        run: |
          git config user.name "facts-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facts.json
          git diff --staged --quiet || git commit -m "facts.json otomatik güncelleme"
          git push
