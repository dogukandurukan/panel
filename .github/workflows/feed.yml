name: borsa-feed
on:
  schedule:
    # Her gün: borsa hafta sonu kapalı ama aynı feed Türkiye/dünya gündemini
    # de üretiyor, o hafta sonu bayatlamasın.
    - cron: '0 6 * * *'    # 09:00 Türkiye
    - cron: '0 11 * * *'   # 14:00 Türkiye
  workflow_dispatch:          # "Run workflow" ile elle de tetiklenir
jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python panel_feed.py
      - name: borsa.json'u commit et
        run: |
          git config user.name "borsa-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add borsa.json
          git diff --staged --quiet || git commit -m "borsa.json otomatik güncelleme"
          git push
