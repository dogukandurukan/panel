name: borsa-feed
on:
  schedule:
    # Her gün: borsa hafta sonu kapalı ama aynı feed Türkiye/dünya gündemini
    # de üretiyor, o hafta sonu bayatlamasın.
    - cron: '0 6 * * *'    # 09:00 Türkiye
    - cron: '0 11 * * *'   # 14:00 Türkiye
  workflow_dispatch:          # "Run workflow" ile elle de tetiklenir
    inputs:
      zorla:
        description: 'Hafta sonu da olsa sinyal bildirimini gönder (test)'
        type: boolean
        default: false
jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python panel_feed.py
      - name: borsa.json'u commit et
        run: |
          git config user.name "borsa-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add borsa.json
          git diff --staged --quiet || git commit -m "borsa.json otomatik güncelleme"
          git push
      # Teknik sinyal özeti telefona (11 Kas). Ayrı adım ve continue-on-error:
      # pywebpush kurulamazsa ya da push servisi hata verirse borsa.json
      # zaten commit edilmiş olur, feed kırmızıya dönmez.
      - name: sinyal bildirimi
        continue-on-error: true
        run: |
          pip install pywebpush
          python borsa_push.py
        env:
          PANEL_GIST_TOKEN: ${{ secrets.PANEL_GIST_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
          BORSA_ZORLA: ${{ inputs.zorla }}
