name: borsa-feed
on:
  schedule:
    # Her gün: borsa hafta sonu kapalı ama aynı feed Türkiye/dünya gündemini
    # de üretiyor, o hafta sonu bayatlamasın.
    - cron: '0 6 * * *'    # 09:00 Türkiye
    - cron: '0 11 * * *'   # 14:00 Türkiye
  workflow_dispatch:          # "Run workflow" ile elle de tetiklenir
    inputs:
      zorla:
        description: 'Hafta sonu da olsa sinyal bildirimini gönder (test)'
        type: boolean
        default: false
      hedef:
        description: 'TR saati SS:DD — o saate kadar bekle (push.yml dış tetikten verir)'
        type: string
        default: ''
# Bekleyen dış tetik koşusu ile geciken schedule koşusu aynı anda borsa.json
# yazmasın: sıraya girerler.
concurrency:
  group: borsa-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      # ZAMANLAMA (11 Kas): schedule bu iş akışını saatlerce geciktiriyor ya da
      # hiç çalıştırmıyor. Zamanında koşu push.yml'den gelir: cron-job.org'un
      # 08:15 / 12:15 tetiği bu iş akışını hedef=09:00 / 14:00 ile başlatır,
      # burada o saate kadar beklenir. Bekleme checkout'tan ÖNCE: uyurken
      # repoya başka commit düşerse push reddedilmesin.
      - name: hedef saate kadar bekle
        if: inputs.hedef != ''
        run: |
          simdi=$(date +%s)
          hedef=$(TZ=Europe/Istanbul date -d "today ${{ inputs.hedef }}" +%s)
          fark=$((hedef - simdi))
          echo "hedef ${{ inputs.hedef }} TR — $fark sn"
          if [ "$fark" -gt 0 ] && [ "$fark" -lt 7200 ]; then sleep "$fark"; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python panel_feed.py
      - name: borsa.json'u commit et
        run: |
          git config user.name "borsa-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add borsa.json
          git diff --staged --quiet || git commit -m "borsa.json otomatik güncelleme"
          git pull --rebase -q || true
          git push
      # Teknik sinyal özeti telefona (11 Kas). Ayrı adım ve continue-on-error:
      # pywebpush kurulamazsa ya da push servisi hata verirse borsa.json
      # zaten commit edilmiş olur, feed kırmızıya dönmez.
      - name: sinyal bildirimi
        continue-on-error: true
        run: |
          pip install pywebpush
          python borsa_push.py
        env:
          PANEL_GIST_TOKEN: ${{ secrets.PANEL_GIST_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
          BORSA_ZORLA: ${{ inputs.zorla }}
          TETIK: ${{ github.event_name }}
