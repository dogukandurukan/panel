name: jobs-feed
on:
  schedule:
    - cron: '0 5 * * *'      # her gün 08:00 Türkiye
  workflow_dispatch:          # "Run workflow" ile elle de tetiklenir
jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # jobs_feed.py yalnızca standart kütüphane kullanır — pip kurulumu gerekmez
      # Jooble = Türkiye ilanları. Anahtar YALNIZCA secret'ta durur; tanımlı
      # değilse jobs_feed onu sessizce atlar ve feed normal çalışır.
      - run: python jobs_feed.py
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      - name: jobs.json'u commit et
        run: |
          git config user.name "jobs-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "jobs.json otomatik güncelleme"
          git push
