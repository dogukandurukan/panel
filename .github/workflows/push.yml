name: push-yoklama
on:
  # ZAMANI ÖNEMLİ OLANLAR BURADA DEĞİL — dışarıdan tetikleniyor.
  # GitHub'ın `schedule` tetikleyicisi en iyi çaba: 26 Ağustos'ta 17:55'e
  # kurulu cron 19:06'da çalıştı (71 dk). Spor ve sabah rutini hatırlatmaları
  # tam saatinde gelmek zorunda olduğu için onlar dış zamanlayıcıdan geliyor
  # (kurulumu DEVAM.md'de). Buradaki cron'lar gecikmesi önemsiz olanlar için.
  #
  # DIŞ TETİK = workflow_dispatch uç noktası. ÖLÇÜLDÜ:
  #   workflow_dispatch  -> koşu 2 saniyede oluştu
  #   repository_dispatch -> 98 sn / 124 sn / birkaç dakika, üstelik dört
  #                          tetiğin bir kısmı hiç koşu üretmedi (API 204
  #                          dönüyor ama iş akışı başlamıyor).
  # repository_dispatch yedek olarak açık bırakıldı ama güvenilmez.
  repository_dispatch:
    types: [yoklama]
  # Saatler Türkiye'ye göre; cron UTC olduğu için 3 saat geri yazıldı.
  # Cron'lar dilim saatinin 35 dk ÖNCESİNE kurulu (push_feed.py ONCE_DK);
  # gecikme olmazsa betik dilim saatine kadar uyuyup tam saatinde gönderiyor.
  # Bir dilimin saati değişirse buradaki cron'u da 35 dk önden yeniden yaz.
  schedule:
    - cron: '55 14 * * *'    # 18:30 TR — gitar / DJ
    - cron: '55 17 * * *'    # 21:30 TR — kişisel proje
    - cron: '25 19 * * *'    # 23:00 TR — yatış
    - cron: '55 19 * * *'    # 23:30 TR — kitap
  workflow_dispatch:          # elle deneme
    inputs:
      zorla:
        description: 'Pencere dışı olsa da en yakın dilim için bildirim gönder (test)'
        type: boolean
        default: false
jobs:
  gonder:
    runs-on: ubuntu-latest
    # Betik dilim saatine kadar uyuyabiliyor (en fazla ~40 dk); sapmış bir
    # koşu runner'ı saatlerce tutmasın.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # pywebpush KASITEN ortak requirements.txt'te değil: bir alt bağımlılığı
      # (http-ece) bazı ortamlarda derlenmiyor ve bu iş akışı çökerse diğer
      # feed'ler (gmail, borsa, jobs, facts) etkilenmemeli.
      - run: pip install requests pywebpush
      - run: python push_feed.py
        env:
          # Gists okuma izinli token — abonelik gizli gist'te duruyor
          PANEL_GIST_TOKEN: ${{ secrets.PANEL_GIST_TOKEN }}
          # Panelin kurulum sırasında bir kez gösterdiği VAPID gizli anahtarı
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          # Opsiyonel: VAPID 'sub' adresi. Tanımsızsa kişisel olmayan
          # varsayılan kullanılır; push servisi reddederse buraya gerçek
          # e-posta secret olarak konulur (repoya yazılmaz).
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
          # Tetikleyen cron ifadesi: hangi dilim için kurulduğunu kesinleştirir.
          # Tahmine gerek kalmıyor, birbirine yakın dilimlerde (23:00 / 23:30)
          # iki koşunun aynı bildirimi ikizlemesi imkânsız oluyor.
          CRON: ${{ github.event.schedule }}
          # Dış tetikte (repository_dispatch) tahmin ve uzun uyku devre dışı:
          # tetik zamanında geldiği için "şu an başlayan dilim" aranıyor.
          TETIK: ${{ github.event_name }}
          # Test için: pencere ve "zaten işaretlenmiş" kontrolünü atlar
          ZORLA: ${{ inputs.zorla }}
